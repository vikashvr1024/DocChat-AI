[project]
name = "docchat-ai"
version = "0.1.0"
description = "Fine-tuned LLM for Document Q&A and Toxicity Detection without RAG"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "streamlit>=1.31.0",
    "torch>=2.2.0",
    "transformers>=4.38.0",
    "peft>=0.9.0",
    "accelerate>=0.27.0",
    "bitsandbytes>=0.42.0",
    "datasets>=2.17.0",
    "pydantic>=2.6.0",
    "evaluate>=0.4.1",
    "rouge-score>=0.1.2",
    "scikit-learn>=1.4.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.1",
    "tqdm>=4.66.0",
]

[tool.uv]
managed = true
dev-dependencies = [
    "pytest>=8.0.0",
    "black>=24.2.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
